name: Snapshot tag

# When the release pull request has been merged, this creates the one
# `v<label>` tag on the merge commit. It does not trust the commit title: the
# `Locked Rust source checks` run for that very commit has already rebuilt and
# packaged the plugins and checked them strictly, and this job verifies the
# release commit again against the previous release as it is now before it
# creates anything. It publishes nothing and does not start the release workflow:
# preparing and publishing stay manual runs of `Official plugin candidate` on the
# tag.
#
# A tag created with the workflow token starts no `push` workflow, so nothing
# else reacts to the new tag.
on:
  workflow_run:
    workflows: ['Locked Rust source checks']
    types: [completed]

concurrency:
  group: snapshot-tag
  cancel-in-progress: false

permissions: {}

jobs:
  tag:
    # Only a passed run of this repository's checks on a push to main, for a
    # commit that is titled as a release.
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_branch == 'main'
      && github.event.workflow_run.head_repository.full_name == github.repository
      && startsWith(github.event.workflow_run.head_commit.message, 'chore(release): ') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    env:
      RUSTUP_TOOLCHAIN: 1.98.1
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          fetch-tags: true
      - name: Install the pinned Rust tools
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Build the verifier from the parent of the release commit
        run: |
          set -euo pipefail
          # The tool that judges the release commit is never built from that
          # commit: a release commit that carried its own tool could vouch for
          # itself. (The verifier also refuses a release commit that touches
          # anything but plugin manifests, so the two sources are the same.)
          git worktree add --detach "$RUNNER_TEMP/verifier-source" "$RELEASE_SHA^"
          cargo build --quiet --locked \
            --manifest-path "$RUNNER_TEMP/verifier-source/tools/among-tools/Cargo.toml" \
            --target-dir "$RUNNER_TEMP/verifier-target"
      - name: Download the build records of the checked release commit
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          # Two --name values are documented by `gh run download` (it is
          # `-n <name1> -n <name2>`) and each artifact then goes into a
          # subdirectory of its own name, which the next step reads.
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --dir builds \
            --name "plugin-version-builds-amd64-$RELEASE_SHA" \
            --name "plugin-version-builds-arm64-$RELEASE_SHA"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
      - name: Verify the release commit and create the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tool="$RUNNER_TEMP/verifier-target/debug/among-tools"
          # Strict version check against the previous release as it is now, the
          # computed next label against the label in the title, and a diff that
          # changes only version lines. Fails before anything is created.
          label=$("$tool" snapshot-verify . "$GITHUB_REPOSITORY" \
            "builds/plugin-version-builds-amd64-$RELEASE_SHA/build.json" \
            "builds/plugin-version-builds-arm64-$RELEASE_SHA/build.json")
          # Idempotent: the tag at this commit is only confirmed, a tag anywhere
          # else is an error, and an existing tag is never moved.
          # Whether the tag exists is read from the list of matching refs (an
          # empty list means it does not); a failing call fails the step instead
          # of reading as "absent". The label is a checked version, so it is safe
          # in the filter.
          existing=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$label" \
            --jq '[.[] | select(.ref == "refs/tags/'"$label"'") | .object.type + " " + .object.sha] | first // ""')
          if [ -z "$existing" ]; then
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$label" -f "sha=$RELEASE_SHA" > /dev/null
            echo "Tagged $RELEASE_SHA as $label."
          elif [ "$existing" = "commit $RELEASE_SHA" ]; then
            echo "$label already points at $RELEASE_SHA."
          else
            echo "$label exists and points elsewhere ($existing)." >&2
            exit 1
          fi
