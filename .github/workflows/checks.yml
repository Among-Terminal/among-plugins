name: Locked Rust source checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  native:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            kernel: x86_64
            rust_host: x86_64-unknown-linux-gnu
            architecture: amd64
          - runner: ubuntu-24.04-arm
            kernel: aarch64
            rust_host: aarch64-unknown-linux-gnu
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_BUILD_JOBS: '1'
      EXPECTED_KERNEL: ${{ matrix.kernel }}
      EXPECTED_RUST_HOST: ${{ matrix.rust_host }}
      RUSTUP_TOOLCHAIN: 1.98.1
      RUSTFLAGS: ''
      CARGO_ENCODED_RUSTFLAGS: ''
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Require the native build architecture
        run: |
          test "$(uname -m)" = "$EXPECTED_KERNEL"
      - name: Install the pinned Rust tools
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - name: Bind the actual compiler host
        run: |
          rustc +1.98.1 --version --verbose
          test "$(rustc +1.98.1 --version --verbose | sed -n 's/^host: //p')" = "$EXPECTED_RUST_HOST"
      - name: Format
        run: cargo +1.98.1 fmt --all --check
      - name: Clippy
        run: cargo +1.98.1 clippy --locked --all-targets -- -D warnings
      - name: Build the managed transport process fixture
        run: cargo +1.98.1 build --locked --example managed-status --example managed-pages
      - name: Original unit and process tests
        run: cargo +1.98.1 test --locked --all-targets
      - name: Standalone production binary build
        run: cargo +1.98.1 build --release --locked --bins
      - name: Packaging tools quality gate
        run: |
          cargo +1.98.1 fmt --manifest-path tools/among-tools/Cargo.toml --all --check
          cargo +1.98.1 clippy --manifest-path tools/among-tools/Cargo.toml --locked --all-targets -- -D warnings
          cargo +1.98.1 test --manifest-path tools/among-tools/Cargo.toml --locked --all-targets
          cargo +1.98.1 build --manifest-path tools/among-tools/Cargo.toml --locked
      - name: Build native packages and complete vendored source delivery
        run: |
          set -euo pipefail
          mkdir dist
          cargo +1.98.1 vendor --locked --versioned-dirs --sync tools/among-tools/Cargo.toml vendor > dist/vendor-config.toml
          tools/among-tools/target/debug/among-tools plugin-packages "$PWD" "$PWD/target/release" "$PWD/vendor" "$PWD/dist/${{ matrix.architecture }}"
          (cd "dist/${{ matrix.architecture }}" && sha256sum -c SHA256SUMS)
      - name: Delivered source builds offline without the original checkout or registry
        run: |
          set -euo pipefail
          mkdir dist/source-check
          tar -xzf dist/${{ matrix.architecture }}/among-plugins-*-source.tar.gz -C dist/source-check
          mkdir dist/empty-cargo-home
          export CARGO_HOME="$PWD/dist/empty-cargo-home"
          cd dist/source-check/source
          cargo +1.98.1 check --offline --locked
          cargo +1.98.1 check --manifest-path tools/among-tools/Cargo.toml --offline --locked
      - name: Retain exact native plugin packages and inspection results
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: official-plugin-packages-${{ matrix.architecture }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist/${{ matrix.architecture }}/
          if-no-files-found: error
          retention-days: 14
      - name: Record actual managed resource measurements
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/managed-system-measurements-$EXPECTED_KERNEL"
          mkdir -m 700 "$root"
          git rev-parse HEAD > "$root/source.txt"
          binary="$PWD/target/debug/system-status-managed"
          test -f "$binary" && test -x "$binary" && test ! -L "$binary"
          sha256sum "$binary" > "$root/binary-sha256.txt"
          # The unchanged full suite above remains mandatory. This additional
          # exact invocation retains successful numeric observations, not a
          # retry or a serial substitute for any failed original test.
          cargo +1.98.1 test --locked --test managed_system \
            managed_system_measures_real_cpu_memory_and_root_disk \
            -- --exact --nocapture --color=never 2>&1 | tee "$root/measurements.log"
          grep -Fq 'test result: ok. 1 passed; 0 failed; 0 ignored;' "$root/measurements.log"
          test "$(grep -Fc 'actual_managed_resources ' "$root/measurements.log")" -eq 1
          sha256sum -c "$root/binary-sha256.txt"
      - name: Retain source-bound managed measurement evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: managed-system-measurements-${{ matrix.kernel }}
          path: ${{ runner.temp }}/managed-system-measurements-${{ matrix.kernel }}/
          if-no-files-found: warn
          retention-days: 5
