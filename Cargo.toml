# modified after extraction from Among Terminal: managed-only entrypoints and SDK dependencies.
# original input and subsequent changes are recorded in PROVENANCE.md.
[package]
name = "among-example-plugins"
version = "0.1.2"
edition = "2021"
rust-version = "1.98"
license = "Apache-2.0"
publish = false
autobins = false

[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rustix = { version = "1", features = ["fs", "event"] }

[dev-dependencies]
rustix = { version = "1", features = ["pipe"] }

[[bin]]
name = "clock-managed"
path = "src/bin/clock-managed.rs"

[[bin]]
name = "system-status-managed"
path = "src/bin/system-status-managed.rs"

[[bin]]
name = "pane-pwd-managed"
path = "src/bin/pane-pwd-managed.rs"
